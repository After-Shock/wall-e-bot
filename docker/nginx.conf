server {
    listen 80;
    server_name localhost;

    # Re-resolve the backend at request time.
    #
    # With a literal hostname in proxy_pass ("http://backend:3001"), nginx
    # resolves it ONCE at startup and caches that address for the life of the
    # process. Recreating the backend container gives it a new IP on the bridge
    # network, and nginx keeps dialling the old one — every /api and /auth
    # request returns 502 while the backend is perfectly healthy, until the
    # frontend happens to be restarted. That is exactly what happened after a
    # run of backend-only deploys.
    #
    # 127.0.0.11 is Docker's embedded DNS server. Putting the host in a variable
    # forces nginx to consult the resolver per request instead of baking in an
    # address at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_host backend;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://$backend_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy auth requests to backend
    location /auth {
        proxy_pass http://$backend_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
